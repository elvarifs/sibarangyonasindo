<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SI BARANG YONASINDO</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Lora:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--g9:#0b2e22;--g8:#0f4230;--g7:#166243;--g6:#1f8a5b;--g3:#bfe3cf;--g1:#e9f5ee;--bg:#d7eadf;--ink:#10231b;--mut:#587566;--card:#fbfdfb;--line:#c3dccd;--warn:#b7791f;--bad:#b4402f;--ok:#1f8a5b;--r:14px}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:Outfit,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:Lora,Georgia,serif;font-weight:600}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #ffd966;outline-offset:2px}
.hide{display:none!important}
.logo{width:44px;height:44px;object-fit:contain;border-radius:10px;background:#fff;padding:3px}

/* LOGIN */
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 15%,#1f8a5b 0,transparent 45%),radial-gradient(circle at 85% 85%,#0b2e22 0,transparent 50%),var(--g8);overflow:hidden;position:relative;perspective:1200px}
.scene{position:absolute;inset:0;pointer-events:none}
.cube{position:absolute;width:var(--s);height:var(--s);left:var(--x);top:var(--y);transform-style:preserve-3d;animation:spin var(--t) linear infinite;opacity:.9}
.cube i{position:absolute;inset:0;border:2px solid rgba(255,255,255,.35);background:rgba(191,227,207,.12);display:grid;place-items:center;font:600 calc(var(--s)/4.2) Outfit;color:rgba(255,255,255,.7);font-style:normal;backdrop-filter:blur(2px)}
.cube i:nth-child(1){transform:translateZ(calc(var(--s)/2))}
.cube i:nth-child(2){transform:rotateY(180deg) translateZ(calc(var(--s)/2))}
.cube i:nth-child(3){transform:rotateY(90deg) translateZ(calc(var(--s)/2))}
.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(calc(var(--s)/2))}
.cube i:nth-child(5){transform:rotateX(90deg) translateZ(calc(var(--s)/2))}
.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(calc(var(--s)/2))}
@keyframes spin{from{transform:rotateX(-20deg) rotateY(0) translateY(0)}50%{transform:rotateX(160deg) rotateY(180deg) translateY(-24px)}to{transform:rotateX(340deg) rotateY(360deg) translateY(0)}}
.lcard{position:relative;width:min(400px,100%);background:rgba(251,253,251,.96);border-radius:22px;padding:32px 28px;box-shadow:0 30px 60px -20px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.4);transition:transform .15s ease-out;transform-style:preserve-3d}
.lcard .brand{display:flex;gap:12px;align-items:center;margin-bottom:22px;transform:translateZ(30px)}
.lcard h1{font-size:22px;line-height:1.1;letter-spacing:.2px}
.lcard small{color:var(--mut)}
.lcard form{transform:translateZ(20px)}

/* FORM */
label{display:block;font-weight:500;font-size:13px;margin:14px 0 5px;color:var(--g8)}
input,select{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
input:focus,select:focus{border-color:var(--g6);outline:none;box-shadow:0 0 0 3px rgba(31,138,91,.18)}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:600;background:var(--g7);color:#fff;transition:transform .1s,background .2s}
.btn:hover{background:var(--g6)}.btn:active{transform:scale(.97)}
.btn.full{width:100%;margin-top:20px;padding:13px}
.btn.ghost{background:transparent;color:var(--g7);border:1.5px solid var(--g7)}
.btn.bad{background:var(--bad)}.btn.sm{padding:6px 12px;font-size:13px}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}

/* LOADING */
#load{position:fixed;inset:0;background:rgba(11,46,34,.82);display:grid;place-items:center;z-index:99;backdrop-filter:blur(3px);transition:opacity .25s}
#load.off{opacity:0;pointer-events:none}
.stack{width:64px;height:64px;position:relative;transform:rotateX(60deg) rotateZ(45deg);transform-style:preserve-3d}
.stack b{position:absolute;inset:0;border-radius:6px;background:var(--g3);border:2px solid #fff;animation:lift 1.2s ease-in-out infinite}
.stack b:nth-child(2){animation-delay:.15s;background:#7fcaa0}.stack b:nth-child(3){animation-delay:.3s;background:var(--g6)}
@keyframes lift{0%,100%{transform:translateZ(0)}50%{transform:translateZ(46px)}}
#load p{color:#fff;margin-top:70px;text-align:center;font-weight:500}

/* APP SHELL */
#app{min-height:100vh;display:flex;flex-direction:column}
.top{background:var(--g8);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.top .logo{width:36px;height:36px}
.top h2{font-size:17px;flex:1;line-height:1.1}.top h2 span{display:block;font:400 12px Outfit;opacity:.75}
.me{font-size:13px;text-align:right}.me b{display:block}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--g9);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:#9cc7b0;padding:8px 2px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:#fff;background:var(--g7)}
.bdg{position:absolute;top:3px;right:calc(50% - 20px);background:#ffd966;color:#3a2a00;border-radius:9px;font-size:10px;font-weight:700;padding:0 5px}
main{flex:1;padding:18px 14px 90px;width:100%;max-width:1100px;margin:0 auto}
footer{text-align:center;font-size:12.5px;color:var(--g8);padding:14px 16px 84px;border-top:1px solid var(--line)}
@media(min-width:860px){
 nav{top:56px;bottom:0;right:auto;width:210px;flex-direction:column;justify-content:flex-start;padding:14px 10px;gap:4px}
 nav button{flex:0;flex-direction:row;gap:12px;font-size:14px;padding:11px 14px;border-radius:10px;text-align:left}
 .bdg{position:static;margin-left:auto}
 main,footer{margin-left:210px;width:calc(100% - 210px);max-width:none;padding-left:32px;padding-right:32px}
 main>*{max-width:1000px}footer{padding-bottom:14px}
}

/* CONTENT */
.ph{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
.ph h2{font-size:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--g8);color:#fff;border-radius:var(--r);padding:16px}
.stat:nth-child(2){background:var(--g7)}.stat:nth-child(3){background:#7a6a1f}.stat:nth-child(4){background:var(--g9)}
.stat b{font:600 30px Lora;display:block}.stat span{font-size:13px;opacity:.85}
.panel{background:var(--card);border-radius:var(--r);padding:16px;border:1px solid var(--line);margin-bottom:16px}
.panel h3{font-size:17px;margin-bottom:10px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th{text-align:left;font-weight:600;color:var(--mut);font-size:12.5px;padding:8px 10px;border-bottom:2px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--g1);vertical-align:middle}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12.5px;font-weight:600}
.pill.Menunggu{background:#fbefc9;color:#7a5410}.pill.Disetujui{background:#d3f0df;color:#14663f}.pill.Ditolak{background:#f6d9d4;color:#8f2d1e}
.low{color:var(--bad);font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:560px){.row2{grid-template-columns:1fr}}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
/* modal & toast */
.modal{position:fixed;inset:0;background:rgba(11,46,34,.6);display:grid;place-items:center;padding:16px;z-index:50}
.mbox{background:#fff;border-radius:18px;padding:22px;width:min(440px,100%);max-height:90vh;overflow:auto;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.mbox h3{font-size:19px;margin-bottom:4px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--g9);color:#fff;padding:11px 18px;border-radius:10px;z-index:100;font-size:14px;max-width:90vw}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="load" class="off"><div><div class="stack"><b></b><b></b><b></b></div><p id="loadtxt">Memuat data...</p></div></div>

<!-- LOGIN -->
<section id="login">
  <div class="scene" id="scene"></div>
  <div class="lcard" id="lcard">
    <div class="brand"><img class="logo" src="logo.png" alt="Logo Yonasindo" onerror="this.onerror=null;this.src=FALLBACK_LOGO"><div><h1>SI BARANG<br>YONASINDO</h1><small>Pencatatan pengambilan ATK</small></div></div>
    <form id="lf">
      <label for="u">Username</label><input id="u" autocomplete="username" required>
      <label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
      <div class="err" id="le"></div>
      <button class="btn full">Masuk</button>
    </form>
  </div>
</section>

<!-- APP -->
<div id="app" class="hide">
  <header class="top"><img class="logo" src="logo.png" alt="" onerror="this.onerror=null;this.src=FALLBACK_LOGO"><h2>SI BARANG YONASINDO<span>Manajemen ATK</span></h2><div class="me"><b id="mn"></b><span id="mr"></span></div><button class="btn ghost sm" style="color:#fff;border-color:#9cc7b0" onclick="logout()">Keluar</button></header>
  <nav id="nav"></nav>
  <main id="main"></main>
  <footer>Aplikasi Si Barang Yonasindo ini dirancang dan dibuat oleh Elvari Faisal (Tim IT LPK YONASINDO)</footer>
</div>
<div id="toast" class="hide"></div>

<script>
/* ============ KONFIGURASI ============ */
const API = 'https://script.google.com/macros/s/AKfycbyj7QrbGITA_drX5fonpF3LzMjki408BH4xJCv9u5bly_1MtXPpM6OQkBMvhe4PL_eN/exec';
/* Letakkan file logo di folder yang sama dengan nama logo.png. Jika belum ada, logo sementara dipakai. */
const FALLBACK_LOGO = 'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="#0f4230"/><path d="M14 18l18 20 18-20M32 38v14" stroke="#bfe3cf" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>');

const ROLE = {admin:'Admin',kepala:'Kepala Divisi ATK',petugas:'Petugas Pengambilan'};
const ICON = {
 dash:'<path d="M3 12l9-8 9 8M5 10v10h14V10"/>',
 ambil:'<path d="M4 7h16l-1.5 12h-13zM8 7a4 4 0 018 0"/>',
 setuju:'<path d="M5 12l5 5 9-10"/>',
 stok:'<path d="M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8"/>',
 log:'<path d="M5 4h14v16H5zM9 9h6M9 13h6M9 17h3"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/>'
};
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S = {user:null,token:null,view:'dash',d:{barang:[],pengambilan:[],log:[],users:[]}};

/* ============ UTIL ============ */
function loading(on,t){ $('#loadtxt').textContent=t||'Memuat data...'; $('#load').classList.toggle('off',!on); }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.remove('hide'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.add('hide'),3200); }
async function api(action,data={},txt){
  loading(true,txt);
  try{
    const r = await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:S.token,...data})});
    const j = await r.json();
    if(!j.ok){ if(j.error==='SESI_HABIS'){ logout(true); throw new Error('Sesi berakhir, silakan masuk lagi.'); } throw new Error(j.error); }
    return j.data;
  }catch(e){ throw e.message==='Failed to fetch' ? new Error('Tidak dapat terhubung ke server. Periksa URL Apps Script.') : e; }
  finally{ loading(false); }
}
const today = () => new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fmtD = s => { const [y,m,d]=String(s).slice(0,10).split('-'); return d?`${d}/${m}/${y}`:s; };
function modal(html){ const m=document.createElement('div'); m.className='modal'; m.innerHTML=`<div class="mbox">${html}</div>`; m.addEventListener('mousedown',e=>{if(e.target===m)m.remove()}); document.body.appendChild(m); const f=m.querySelector('input,select'); f&&f.focus(); return m; }
const closeM = () => document.querySelectorAll('.modal').forEach(m=>m.remove());
async function run(fn,ok){ try{ await fn(); closeM(); if(ok)toast(ok); await refresh(); }catch(e){ toast(e.message); } }

/* ============ LOGIN 3D ============ */
(function scene(){
  const w=['ATK','PENA','KERTAS','STAPLES','LEM','MAP'];
  const cfg=[[90,'6%','12%',22],[60,'82%','10%',17],[120,'75%','62%',28],[70,'10%','70%',19],[46,'48%','84%',15],[54,'40%','6%',21]];
  $('#scene').innerHTML=cfg.map((c,i)=>`<div class="cube" style="--s:${c[0]}px;--x:${c[1]};--y:${c[2]};--t:${c[3]}s">${w.slice(0,6).map((_,k)=>`<i>${w[(i+k)%6]}</i>`).join('')}</div>`).join('');
  const L=$('#login'),C=$('#lcard');
  L.addEventListener('mousemove',e=>{ const x=(e.clientX/innerWidth-.5)*14,y=(e.clientY/innerHeight-.5)*-14; C.style.transform=`rotateY(${x}deg) rotateX(${y}deg)`; });
  L.addEventListener('mouseleave',()=>C.style.transform='');
})();
$('#lf').onsubmit = async e => {
  e.preventDefault(); $('#le').textContent='';
  if(API.startsWith('GANTI')){ $('#le').textContent='URL Apps Script belum diisi di index.html.'; return; }
  try{
    const r = await api('login',{username:$('#u').value,password:$('#p').value},'Memeriksa akun...');
    S.token=r.token; S.user=r.user; sessionStorage.setItem('sb',JSON.stringify({t:r.token,u:r.user}));
    $('#p').value=''; await start();
  }catch(err){ $('#le').textContent=err.message; }
};
function logout(silent){ sessionStorage.removeItem('sb'); S.token=S.user=null; $('#app').classList.add('hide'); $('#login').classList.remove('hide'); if(!silent)toast('Anda sudah keluar.'); }

/* ============ APP ============ */
function menu(){
  const r=S.user.role, m=[['dash','Beranda']];
  m.push(['ambil','Pengambilan']);
  if(r!=='petugas'){ m.push(['setuju','Persetujuan'],['stok','Stok ATK'],['log','Riwayat Stok']); }
  if(r==='admin') m.push(['user','Pengguna']);
  return m;
}
async function start(){
  $('#login').classList.add('hide'); $('#app').classList.remove('hide');
  $('#mn').textContent=S.user.nama; $('#mr').textContent=ROLE[S.user.role]; S.view='dash';
  try{ await refresh(); }catch(e){ toast(e.message); }
}
async function refresh(){ S.d = Object.assign({barang:[],pengambilan:[],log:[],users:[]}, await api('getData')); render(); }
function render(){
  const pend=S.d.pengambilan.filter(p=>p.status==='Menunggu').length;
  $('#nav').innerHTML=menu().map(([k,l])=>`<button class="${S.view===k?'on':''}" onclick="go('${k}')"><svg viewBox="0 0 24 24">${ICON[k]}</svg>${l}${k==='setuju'&&pend?`<span class="bdg">${pend}</span>`:''}</button>`).join('');
  $('#main').innerHTML = V[S.view]();
  window.scrollTo(0,0);
}
function go(v){ S.view=v; render(); }

const statusPill = s => `<span class="pill ${s}">${s}</span>`;
const V = {
dash(){
  const b=S.d.barang,p=S.d.pengambilan,low=b.filter(x=>+x.stok<=+x.minimum);
  const bulan=today().slice(0,7), pm=p.filter(x=>x.tanggal.startsWith(bulan)&&x.status==='Disetujui').reduce((a,x)=>a+ +x.jumlah,0);
  return `<div class="ph"><h2>Halo, ${esc(S.user.nama)}</h2></div>
  <div class="grid"><div class="stat"><b>${b.length}</b><span>Jenis barang ATK</span></div>
  <div class="stat"><b>${b.reduce((a,x)=>a+ +x.stok,0)}</b><span>Total stok tersedia</span></div>
  <div class="stat"><b>${p.filter(x=>x.status==='Menunggu').length}</b><span>Menunggu persetujuan</span></div>
  <div class="stat"><b>${pm}</b><span>Barang keluar bulan ini</span></div></div>
  <div class="panel"><h3>Stok hampir habis</h3>${low.length?low.map(x=>`<p><span class="low">${esc(x.nama)}</span> tersisa ${x.stok} ${esc(x.satuan)} (batas minimum ${x.minimum})</p>`).join(''):'<p class="empty">Semua stok masih aman.</p>'}</div>
  <div class="panel"><h3>Pengambilan terbaru</h3>${tblAmbil(p.slice(0,6))}</div>`;
},
ambil(){
  const p=S.d.pengambilan;
  return `<div class="ph"><h2>Pengambilan Barang</h2><div class="acts"><button class="btn ghost" onclick="csv()">Unduh CSV</button><button class="btn" onclick="fAmbil()">Catat pengambilan</button></div></div>
  <div class="panel">${tblAmbil(p)}</div>`;
},
setuju(){
  const p=S.d.pengambilan.filter(x=>x.status==='Menunggu');
  return `<div class="ph"><h2>Persetujuan</h2></div><div class="panel">${p.length?`<div class="tw"><table><tr><th>Tanggal</th><th>Nama</th><th>Barang</th><th>Jumlah</th><th>Stok</th><th></th></tr>${p.map(x=>{const b=S.d.barang.find(y=>y.id===x.barang_id)||{stok:0,satuan:''};return `<tr><td>${fmtD(x.tanggal)}</td><td>${esc(x.nama)}</td><td>${esc(x.barang)}</td><td>${x.jumlah}</td><td class="${+x.jumlah>+b.stok?'low':''}">${b.stok} ${esc(b.satuan)}</td><td><div class="acts"><button class="btn sm" onclick="proses('${x.id}','Disetujui')">Setujui</button><button class="btn sm bad" onclick="proses('${x.id}','Ditolak')">Tolak</button></div></td></tr>`}).join('')}</table></div>`:'<p class="empty">Tidak ada pengajuan yang menunggu.</p>'}</div>`;
},
stok(){
  const b=S.d.barang,adm=S.user.role==='admin';
  return `<div class="ph"><h2>Stok ATK</h2><button class="btn" onclick="fBarang()">Tambah jenis barang</button></div>
  <div class="panel">${b.length?`<div class="tw"><table><tr><th>Barang</th><th>Stok</th><th>Minimum</th><th></th></tr>${b.map(x=>`<tr><td>${esc(x.nama)}</td><td class="${+x.stok<=+x.minimum?'low':''}">${x.stok} ${esc(x.satuan)}</td><td>${x.minimum}</td><td><div class="acts"><button class="btn sm" onclick="fStok('${x.id}')">Tambah stok</button><button class="btn sm ghost" onclick="fBarang('${x.id}')">Ubah</button>${adm?`<button class="btn sm bad" onclick="hapusB('${x.id}')">Hapus</button>`:''}</div></td></tr>`).join('')}</table></div>`:'<p class="empty">Belum ada barang. Tambahkan jenis barang ATK pertama.</p>'}</div>`;
},
log(){
  const l=S.d.log||[];
  return `<div class="ph"><h2>Riwayat Stok</h2></div><div class="panel">${l.length?`<div class="tw"><table><tr><th>Waktu</th><th>Barang</th><th>Jumlah</th><th>Keterangan</th><th>Oleh</th></tr>${l.map(x=>`<tr><td>${esc(x.waktu)}</td><td>${esc(x.barang)}</td><td class="${x.jumlah[0]==='-'?'low':''}">${esc(x.jumlah)}</td><td>${esc(x.keterangan)}</td><td>${esc(x.oleh)}</td></tr>`).join('')}</table></div>`:'<p class="empty">Belum ada perubahan stok.</p>'}</div>`;
},
user(){
  return `<div class="ph"><h2>Pengguna</h2><button class="btn" onclick="fUser()">Tambah pengguna</button></div><div class="panel"><div class="tw"><table><tr><th>Username</th><th>Nama</th><th>Peran</th><th></th></tr>${S.d.users.map(x=>`<tr><td>${esc(x.username)}</td><td>${esc(x.nama)}</td><td>${ROLE[x.role]}</td><td>${x.role==='admin'?'':`<div class="acts"><button class="btn sm ghost" onclick="fUser('${esc(x.username)}')">Ubah</button><button class="btn sm bad" onclick="hapusU('${esc(x.username)}')">Hapus</button></div>`}</td></tr>`).join('')}</table></div></div>`;
}};
function tblAmbil(p){
  if(!p.length) return '<p class="empty">Belum ada data pengambilan.</p>';
  return `<div class="tw"><table><tr><th>Tanggal</th><th>Nama</th><th>Alat ATK yang diambil</th><th>Jumlah</th><th>Disetujui?</th></tr>${p.map(x=>`<tr><td>${fmtD(x.tanggal)}</td><td>${esc(x.nama)}</td><td>${esc(x.barang)}</td><td>${x.jumlah}</td><td>${statusPill(x.status)}${x.diproses_oleh?`<br><small style="color:var(--mut)">oleh ${esc(x.diproses_oleh)}</small>`:''}</td></tr>`).join('')}</table></div>`;
}

/* ============ FORM & AKSI ============ */
function fAmbil(){
  const b=S.d.barang.filter(x=>+x.stok>0);
  if(!b.length) return toast('Belum ada barang dengan stok tersedia.');
  const m=modal(`<h3>Catat pengambilan</h3><form id="f"><label>Tanggal</label><input type="date" id="a1" value="${today()}" required>
  <label>Nama pengambil</label><input id="a2" value="${S.user.role==='petugas'?'':esc(S.user.nama)}" required>
  <label>Alat ATK</label><select id="a3">${b.map(x=>`<option value="${x.id}">${esc(x.nama)} (sisa ${x.stok} ${esc(x.satuan)})</option>`).join('')}</select>
  <label>Jumlah</label><input type="number" id="a4" min="1" value="1" required>
  <div class="mfoot"><button type="button" class="btn ghost" onclick="closeM()">Batal</button><button class="btn">Kirim untuk disetujui</button></div></form>`);
  m.querySelector('#f').onsubmit=e=>{e.preventDefault();run(()=>api('ambil',{tanggal:$('#a1').value,nama:$('#a2').value,barang_id:$('#a3').value,jumlah:$('#a4').value},'Menyimpan...'),'Pengambilan dicatat, menunggu persetujuan.');};
}
function proses(id,k){ run(()=>api('proses',{id,keputusan:k}),k==='Disetujui'?'Disetujui, stok berkurang otomatis.':'Pengajuan ditolak.'); }
function fBarang(id){
  const b=id?S.d.barang.find(x=>x.id===id):{nama:'',satuan:'pcs',minimum:5};
  const m=modal(`<h3>${id?'Ubah barang':'Tambah jenis barang'}</h3><form id="f"><label>Nama barang</label><input id="b1" value="${esc(b.nama)}" required>
  <div class="row2"><div><label>Satuan</label><input id="b2" value="${esc(b.satuan)}" placeholder="pcs, rim, box"></div><div><label>Stok minimum</label><input id="b3" type="number" min="0" value="${b.minimum}"></div></div>
  ${id?'':'<label>Stok awal</label><input id="b4" type="number" min="0" value="0">'}
  <div class="mfoot"><button type="button" class="btn ghost" onclick="closeM()">Batal</button><button class="btn">Simpan</button></div></form>`);
  m.querySelector('#f').onsubmit=e=>{e.preventDefault();run(()=>api('saveBarang',{id,nama:$('#b1').value,satuan:$('#b2').value,minimum:$('#b3').value,stok:$('#b4')?.value},'Menyimpan...'),'Barang disimpan.');};
}
function fStok(id){
  const b=S.d.barang.find(x=>x.id===id);
  const m=modal(`<h3>Tambah stok</h3><p style="color:var(--mut)">${esc(b.nama)}, stok saat ini ${b.stok} ${esc(b.satuan)}</p><form id="f"><label>Jumlah masuk</label><input id="s1" type="number" min="1" required><label>Keterangan</label><input id="s2" placeholder="Contoh: pembelian dari toko">
  <div class="mfoot"><button type="button" class="btn ghost" onclick="closeM()">Batal</button><button class="btn">Tambah stok</button></div></form>`);
  m.querySelector('#f').onsubmit=e=>{e.preventDefault();run(()=>api('tambahStok',{id,jumlah:$('#s1').value,keterangan:$('#s2').value},'Menyimpan...'),'Stok bertambah.');};
}
function hapusB(id){ if(confirm('Hapus barang ini dari daftar?')) run(()=>api('hapusBarang',{id}),'Barang dihapus.'); }
function fUser(un){
  const u=un?S.d.users.find(x=>x.username===un):{username:'',nama:'',role:'petugas'};
  const m=modal(`<h3>${un?'Ubah pengguna':'Tambah pengguna'}</h3><form id="f"><label>Username</label><input id="u1" value="${esc(u.username)}" ${un?'readonly':''} required>
  <label>Nama lengkap</label><input id="u2" value="${esc(u.nama)}" required>
  <label>Peran</label><select id="u3"><option value="petugas" ${u.role==='petugas'?'selected':''}>Petugas Pengambilan</option><option value="kepala" ${u.role==='kepala'?'selected':''}>Kepala Divisi ATK</option></select>
  <label>Password ${un?'(kosongkan jika tidak diganti)':''}</label><input id="u4" type="password" autocomplete="new-password" ${un?'':'required'}>
  <div class="mfoot"><button type="button" class="btn ghost" onclick="closeM()">Batal</button><button class="btn">Simpan</button></div></form>`);
  m.querySelector('#f').onsubmit=e=>{e.preventDefault();run(()=>api('saveUser',{username:$('#u1').value,nama:$('#u2').value,role:$('#u3').value,password:$('#u4').value},'Menyimpan...'),'Pengguna disimpan.');};
}
function hapusU(un){ if(confirm('Hapus pengguna '+un+'?')) run(()=>api('hapusUser',{username:un}),'Pengguna dihapus.'); }
function csv(){
  const rows=[['Tanggal','Nama','Alat ATK','Jumlah','Status']].concat(S.d.pengambilan.map(x=>[x.tanggal,x.nama,x.barang,x.jumlah,x.status]));
  const t=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'})); a.download='pengambilan-atk.csv'; a.click();
}

/* pulihkan sesi */
try{ const s=JSON.parse(sessionStorage.getItem('sb')||'null'); if(s){ S.token=s.t; S.user=s.u; start(); } }catch(e){}
</script>
